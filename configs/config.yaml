project:
  name: "CodeGen-Pipeline"
  device: "auto"   # Falls back to CPU automatically if CUDA isn't available

model:
  name_or_path: "Qwen/Qwen2.5-Coder-3B"   # base small code LM (matches README)
  embedding_name: "BAAI/bge-m3"  # used for FAISS embeddings
  max_length: 512

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

data:
  raw_dir: "data/raw"
  # dataset key -> subfolder name under raw_dir. Each subfolder may contain
  # multiple .jsonl/.json files; the loader merges all of them.
  datasets:
    spider: "Spider"
    birdbench: "BirdBench"
    codocbench: "CoDocBench"
  sample_limit: 200   # cap per-dataset rows loaded (keeps notebooks fast)

rag:
  codeparrot_subset_size: 500

indexing:
  top_k: 3
  vector_dim: 384   # must match model.embedding_name's output dimension

outputs:
  metrics_dir: "outputs/metrics"
  plots_dir: "outputs/plots"
  logs_dir: "outputs/logs"
  checkpoints_dir: "models/checkpoints/Qwen2.5-Coder_lora"
