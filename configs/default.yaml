# System Configuration
system:
  device: "cuda"                    # GPU device (cuda/cpu) — auto-fallback to cpu if unavailable
  seed: 42                          # Random seed for reproducibility
  log_level: "INFO"
  num_workers: 4
  pin_memory: true

# Model Configuration
model:
  name: "Salesforce/codegen-350M-multi"   # small code-LM baseline (covers C/C++/Go/Java/JS/Python)
  embedding_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_length: 512
  batch_size: 8
  device_map: "auto"

# The LLM comparison arm is provider-agnostic — point this at whatever model
# string your provider expects. Actual key is read from $LLM_API_KEY, never
# stored here.
llm:
  name: "claude-sonnet-5"

# New-language fine-tuning target. Base codegen-350M-multi does not natively
# support this language well, which is the point of the exercise.
finetune_target_language: "Kotlin"

# Fine-tuning Configuration (PEFT/LoRA)
fine_tune:
  enabled: true
  method: "lora"
  lora_rank: 16
  lora_alpha: 32
  dropout: 0.05
  learning_rate: 0.0002
  epochs_subset: 3       # Checkpoint 1 — subset fine-tune
  epochs_full: 5         # Checkpoint 2 — full-data fine-tune
  target_modules: ["qkv_proj", "out_proj"]   # codegen attention projection names

# RAG Configuration
rag:
  top_k: 5
  top_k_sweep: [1, 3, 5, 10]
  faiss_index_type: "IndexFlatIP"
  ast_parser_language: "python"    # swap for TARGET_LANGUAGE via tree-sitter grammar
  embedding_dim: 384
  codeparrot_subset_size: 20000    # cap for embedding-index construction

# Evaluation Configuration
evaluation:
  metrics:
    - "pass_at_k"
    - "codebleu_lite"
    - "bertscore"
    - "bleu"
    - "rouge"
    - "exact_match"
    - "execution_accuracy"
  pass_at_k: [1, 5, 10]
  timeout_seconds: 10

# Dataset Configuration
datasets:
  spider:
    path: "./data/spider"
    split: "train"
  birdBench:
    path: "./data/birdBench"
    split: "train"
  codocbench:
    path: "./data/codocbench"
    split: "train"

# Logging & Output
logging:
  save_dir: "./outputs"
  save_metrics: true
  save_visualizations: true
