system:
  device: "cuda"               # GPU device: "cuda" or "cpu"
  seed: 42                     # Random seed for reproducibility
  log_level: "INFO"            # Logging level
  num_workers: 4               # DataLoader workers
  pin_memory: true             # CUDA memory pinning

model:
  name: "Salesforce/codegen-350M-mono" # Base model
  quantization: "8bit"         # Quantization type ("8bit", "16bit", or "none")
  max_length: 512              # Maximum token length
  batch_size: 32               # Batch size
  device_map: "auto"           # Device mapping ("auto" or explicit mapping)

fine_tune:
  enabled: true
  method: "lora"               # Adapter method (e.g., "lora")
  lora_rank: 16
  lora_alpha: 32
  dropout: 0.05

rag:
  top_k: 5
  faiss_index_type: "IndexFlatIP"
  ast_parser_language: "python"
  embedding_dim: 384

evaluation:
  metrics:
    - "pass_at_k"
    - "codebleu"
    - "bertscore"
    - "exact_match"
    - "execution_accuracy"
  pass_at_k:
    - 1
    - 5
    - 10
  timeout_seconds: 10

datasets:
  spider:
    path: "./data/spider"
    split: "train"
  birdBench:
    path: "./data/birdBench"
    split: "train"
  codocbench:
    path: "./data/codocbench"
    split: "train"

logging:
  save_dir: "./outputs"
  save_metrics: true
  save_visualizations: true
  tensorboard: true